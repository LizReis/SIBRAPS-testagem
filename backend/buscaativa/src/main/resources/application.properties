spring.application.name=buscaativa
spring.jpa.open-in-view=true
# Persistent environments must be migrated explicitly; never recreate them on startup.
spring.jpa.hibernate.ddl-auto=validate
logging.level.org.springframework.security=WARN
agenda.horarios.manha.inicio=07:00
agenda.horarios.manha.fim=11:30
agenda.horarios.tarde.inicio=13:00
agenda.horarios.tarde.fim=18:30
agenda.intervalo-minutos=30

# Configuração externa obrigatória fora do perfil dev.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.h2.console.enabled=false

# Erros documentais são traduzidos no serviço. O H2 pode imprimir chaves em diagnósticos JDBC.
logging.level.org.hibernate.orm.jdbc.error=OFF

# Documentação HTTP e detalhes internos ficam desativados por padrão.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never
