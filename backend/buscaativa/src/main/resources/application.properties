spring.application.name=buscaativa
spring.jpa.open-in-view=true
logging.level.org.springframework.security=WARN
agenda.horarios.manha.inicio=07:00
agenda.horarios.manha.fim=11:30
agenda.horarios.tarde.inicio=13:00
agenda.horarios.tarde.fim=18:30
agenda.intervalo-minutos=30

# Configuração externa obrigatória fora do perfil dev.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.h2.console.enabled=false
