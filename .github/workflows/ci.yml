name: SIBRAPS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_frontend_tests:
        description: 'Executar suíte Angular diagnóstica (Q01–Q04 conhecidos; falhas ficam visíveis)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  backend:
    name: Backend — Java 21 / verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/buscaativa
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/buscaativa/pom.xml
      - name: Compilar e executar todos os testes (inclui segurança e concorrência)
        run: bash ./mvnw --batch-mode verify
      - name: Relatórios JUnit
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: backend-surefire
          path: backend/buscaativa/target/surefire-reports/
          if-no-files-found: warn

  frontend-build:
    name: Frontend — build obrigatório
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend/sentinela-pet
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/sentinela-pet/package-lock.json
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run build

  frontend-tests:
    name: Frontend — diagnóstico Q01–Q04 (opcional/manual)
    if: github.event_name == 'workflow_dispatch' && inputs.run_frontend_tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend/sentinela-pet
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/sentinela-pet/package-lock.json
      - run: npm install --global npm@11.6.2
      - run: npm ci
      # Sem continue-on-error: se selecionado, este job falha com os testes.
      - run: npm test -- --watch=false
