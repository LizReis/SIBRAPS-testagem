name: SIBRAPS - Testes assistenciais
on:
  push:
    branches: [correcao-fluxos-assistenciais-sibraps]
    paths:
      - 'backend/buscaativa/**'
      - '.github/workflows/testes-fluxos-assistenciais.yml'
permissions:
  contents: read
jobs:
  backend:
    name: 6.2C1 - Java 21
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/buscaativa
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/buscaativa/pom.xml
      - name: Colisoes operacionais 6.2C1
        shell: bash
        run: |
          set -o pipefail
          bash ./mvnw -B -ntp '-Dtest=IndividualGroupCollision61Characterization#gi01*+gi02*+gi03*+gi04*+gi10*+gr01*+gr02*+gr03*+gr04*+gr05*+gr06*+gr08*+gr09*,AgendaSeries62Characterization#sr01*+sr02*+sr04*+sr06*,GroupReservation62Tests' test 2>&1 | tee etapa62c1-colisoes.log
      - name: Regressoes direcionadas de grupo
        shell: bash
        run: |
          set -o pipefail
          bash ./mvnw -B -ntp -Dtest=GroupHistoricalResponsibilityTests,GroupFrequencyTemporalTests test 2>&1 | tee etapa62c1-regressao.log
      - name: Relatorios de testes
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: etapa62c1-relatorios
          path: |
            backend/buscaativa/target/surefire-reports/
            backend/buscaativa/etapa62c1-*.log
          retention-days: 7
          if-no-files-found: warn
