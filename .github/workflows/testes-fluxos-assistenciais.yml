name: SIBRAPS - Testes assistenciais
on:
  push:
    branches: [correcao-fluxos-assistenciais-sibraps]
    paths:
      - 'backend/buscaativa/**'
      - '.github/workflows/testes-fluxos-assistenciais.yml'
permissions:
  contents: read
jobs:
  backend:
    name: 6.2C2 - Java 21
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/buscaativa
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/buscaativa/pom.xml
      - name: Colisoes de transferencia e regeneracao 6.2C2
        shell: bash
        run: |
          set -o pipefail
          bash ./mvnw -B -ntp '-Dtest=IndividualGroupCollision61Characterization#gi06*+gr07*,AgendaSeries62Characterization#sr03*+sr05*,GroupSeriesUpdate62Tests,ReconciliationConcurrency61Characterization#co08*' test 2>&1 | tee etapa62c2-colisoes.log
      - name: Regressoes direcionadas de grupo
        shell: bash
        run: |
          set -o pipefail
          bash ./mvnw -B -ntp '-Dtest=GroupHistoricalResponsibilityTests,GroupFrequencyTemporalTests,GroupReservation62Tests,AgendaSeries62Characterization#sr01*+sr02*+sr04*+sr06*' test 2>&1 | tee etapa62c2-regressao.log
      - name: Relatorios de testes
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: etapa62c2-relatorios
          path: |
            backend/buscaativa/target/surefire-reports/
            backend/buscaativa/etapa62c2-*.log
          retention-days: 7
          if-no-files-found: warn
