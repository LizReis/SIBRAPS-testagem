name: SIBRAPS - Testes assistenciais
on:
  push:
    branches: [correcao-fluxos-assistenciais-sibraps]
    paths:
      - 'backend/buscaativa/**'
      - '.github/workflows/testes-fluxos-assistenciais.yml'
permissions:
  contents: read
jobs:
  backend:
    name: 6.2D2 - Java 21
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/buscaativa
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/buscaativa/pom.xml
      - name: Frequencias coletivas 6.2D2
        shell: bash
        run: |
          set -o pipefail
          bash ./mvnw -B -ntp '-Dtest=HistoricalCollision61Characterization,ClinicalIndicators61Characterization#unknownRealizedGroupFrequencyRejectsOrdinaryCorrection*,GroupFactual62Tests,ReconciliationConcurrency61Characterization#co09*+co10*+co11*' test 2>&1 | tee etapa62d2-colisoes.log
      - name: Regressoes de grupo e frequencia
        shell: bash
        run: |
          set -o pipefail
          bash ./mvnw -B -ntp '-Dtest=GroupHistoricalResponsibilityTests,GroupFrequencyTemporalTests,ClinicalAuthorizationTests,ClinicalAuditIntegrationTests,ClinicalJustificationTests,GroupReservation62Tests,GroupSeriesUpdate62Tests,AgendaSeries62Characterization,SpecificFrequencyCorrectionTests,IndividualFactual62Tests' test 2>&1 | tee etapa62d2-regressao.log
      - name: Relatorios de testes
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: etapa62d2-relatorios
          path: |
            backend/buscaativa/target/surefire-reports/
            backend/buscaativa/etapa62d2-*.log
          retention-days: 7
          if-no-files-found: warn
