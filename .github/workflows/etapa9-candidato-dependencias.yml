name: SIBRAPS - Etapa 9 candidato npm e inventario Maven
on:
  push:
    branches: [correcao-cadastro-unico-isolamento]
    paths:
      - '.github/workflows/etapa9-candidato-dependencias.yml'
      - '.github/scripts/etapa9-candidato-npm.mjs'
      - '.github/scripts/etapa9-auditoria-maven.py'
      - '.github/scripts/etapa9-detalhes-maven.py'
      - '.github/scripts/etapa9-maven-baseline.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  npm-candidato:
    name: Preparar candidato npm sem alterar a branch
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend/sentinela-pet
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: npm install --global npm@11.6.2 --no-audit --no-fund
      - name: Resolver candidato compativel e auditar novamente
        run: node ../../.github/scripts/etapa9-candidato-npm.mjs
      - name: Evidencias e lockfile candidato
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: etapa9-candidato-npm
          path: frontend/sentinela-pet/candidato-etapa9/
          retention-days: 30
          if-no-files-found: error
  maven-detalhes:
    name: Detalhar avisos Maven ja identificados
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/buscaativa
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Consultar detalhes dos avisos OSV da base aprovada
        run: python3 ../../.github/scripts/etapa9-detalhes-maven.py
      - name: Evidencias Maven
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: etapa9-detalhes-maven
          path: backend/buscaativa/auditoria-etapa9/
          retention-days: 30
          if-no-files-found: error
