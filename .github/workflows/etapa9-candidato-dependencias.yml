name: SIBRAPS - Etapa 9 candidato npm e inventario Maven
on:
  push:
    branches: [correcao-cadastro-unico-isolamento]
    paths:
      - '.github/workflows/etapa9-candidato-dependencias.yml'
      - '.github/scripts/etapa9-candidato-npm.mjs'
      - '.github/scripts/etapa9-auditoria-maven.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  npm-candidato:
    name: Preparar candidato npm sem alterar a branch
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend/sentinela-pet
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: npm install --global npm@11.6.2 --no-audit --no-fund
      - name: Resolver candidato compativel e auditar novamente
        run: node ../../.github/scripts/etapa9-candidato-npm.mjs
      - name: Evidencias e lockfile candidato
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: etapa9-candidato-npm
          path: frontend/sentinela-pet/candidato-etapa9/
          retention-days: 30
          if-no-files-found: error
  maven-inventario:
    name: Inventario Maven resolvido e consulta OSV
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/buscaativa
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/buscaativa/pom.xml
      - name: Resolver arvore Maven sem executar testes
        shell: bash
        run: |
          mkdir -p auditoria-etapa9
          bash ./mvnw -B -ntp org.apache.maven.plugins:maven-dependency-plugin:3.9.0:tree -DoutputType=json -DoutputFile=auditoria-etapa9/dependency-tree.json
      - name: Consultar avisos OSV por coordenada e versao
        run: python3 ../../.github/scripts/etapa9-auditoria-maven.py
      - name: Evidencias Maven
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: etapa9-auditoria-maven
          path: backend/buscaativa/auditoria-etapa9/
          retention-days: 30
          if-no-files-found: error
