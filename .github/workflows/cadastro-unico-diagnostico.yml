name: SIBRAPS - Diagnostico cadastro unico e perfil profissional
on:
  push:
    branches: [correcao-cadastro-unico-isolamento]
    paths:
      - 'backend/buscaativa/**'
      - 'frontend/sentinela-pet/**'
      - '.github/workflows/cadastro-unico-diagnostico.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Cadastro unico - Backend Java 21 / verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend/buscaativa
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/buscaativa/pom.xml
      - name: Backend completo - Maven verify
        shell: bash
        run: |
          set -o pipefail
          bash ./mvnw -B -ntp verify 2>&1 | tee cadastro-backend-verify.log
      - name: Matriz de concorrencia 6.1 (opt-in)
        shell: bash
        run: |
          set -o pipefail
          bash ./mvnw -B -ntp '-Dtest=ReconciliationConcurrency61Characterization' test 2>&1 | tee cadastro-concorrencia.log
      - name: Relatorios backend
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: cadastro-backend-diagnostico
          path: |
            backend/buscaativa/target/surefire-reports/
            backend/buscaativa/cadastro-*.log
          retention-days: 7
          if-no-files-found: warn

  frontend-build:
    name: Cadastro unico - Build Angular
    # Playwright 1.56.1 supports Ubuntu 24.04, not the 26.04 latest runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend/sentinela-pet
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/sentinela-pet/package-lock.json
      - run: npm install --global npm@11.6.2
      - name: Verificar sintaxe dos scripts de navegador
        run: |
          node --check scripts/etapa8-9-browser.mjs
          node --check scripts/etapa8-10-integracao.mjs
      - run: npm ci --strict-peer-deps
      - run: npm ls --all > /dev/null
      - name: Compilacao de producao
        run: npm run build
      - name: Preservar build de producao para navegador
        run: cp -a dist/sentinela-pet/browser "$RUNNER_TEMP/sibraps-prod"
      - name: Compilacao experimental
        run: npm run build -- --configuration ensaio
      - name: Instalar Chromium para ensaio visual
        run: |
          npm install --prefix "$RUNNER_TEMP/sibraps-browser" --no-audit --no-fund --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/sibraps-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Ensaio de navegador com dados sinteticos
        env:
          PLAYWRIGHT_PREFIX: ${{ runner.temp }}/sibraps-browser
        run: node scripts/etapa8-9-browser.mjs "$RUNNER_TEMP/sibraps-prod" browser-evidence
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/buscaativa/pom.xml
      - name: Preparar servidor HTTP isolado
        working-directory: backend/buscaativa
        run: bash ./mvnw -B -ntp test-compile dependency:build-classpath -Dmdep.outputFile=target/ensaio-classpath.txt -Dmdep.includeScope=test
      - name: Jornada integrada cadastro e isolamento
        env:
          PLAYWRIGHT_PREFIX: ${{ runner.temp }}/sibraps-browser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p integracao-evidence
          export SIBRAPS_ENSAIO_SENHA="$(openssl rand -hex 24)"
          echo "::add-mask::$SIBRAPS_ENSAIO_SENHA"
          export SIBRAPS_ENSAIO_RELOGIO="$(mktemp "$RUNNER_TEMP/sibraps-clock.XXXXXX")"
          printf '%s\n' '2026-11-24T22:00:00Z' > "$SIBRAPS_ENSAIO_RELOGIO"
          (
            cd ../../backend/buscaativa
            exec java -cp "target/test-classes:target/classes:$(cat target/ensaio-classpath.txt)" br.sibraps.ensaiohttp.AplicacaoEnsaioLocal
          ) > integracao-evidence/backend.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; rm -f "$SIBRAPS_ENSAIO_RELOGIO" "$SIBRAPS_ENSAIO_RELOGIO.next"' EXIT
          ready=0
          for i in $(seq 1 90); do
            kill -0 "$pid" || { echo "Servidor isolado encerrou antes do ensaio"; exit 1; }
            if curl -fsS --max-time 3 -o /dev/null -H 'Content-Type: application/json' --data "{\"email\":\"administrador.a@test.local\",\"senha\":\"$SIBRAPS_ENSAIO_SENHA\"}" http://127.0.0.1:8080/api/auth/login 2>/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          node scripts/etapa8-10-integracao.mjs dist/sentinela-pet/browser integracao-evidence
      - name: Evidencias da integracao real
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: etapa8-10-integracao
          path: frontend/sentinela-pet/integracao-evidence/
          retention-days: 7
          if-no-files-found: warn
      - name: Evidencias do navegador
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: etapa8-9-navegador
          path: frontend/sentinela-pet/browser-evidence/
          retention-days: 7
          if-no-files-found: warn

  frontend-permissoes:
    name: Cadastro unico - Suite Angular completa e contrato experimental
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend/sentinela-pet
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/sentinela-pet/package-lock.json
      - run: npm install --global npm@11.6.2
      - run: npm ci --strict-peer-deps
      - name: Suite Angular completa (contrato padrao)
        run: npm test -- --watch=false
      - name: Contrato HTTP integrado experimental
        run: npm test -- --watch=false --configuration ensaio --include=src/app/services/contrato-clinico-integrado.spec.ts
